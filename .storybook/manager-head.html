<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<style>
  /* Stable Storybook DOM hooks (confirmed against the live manager). */
  #root button:hover:not([disabled]) {
    border-radius: 8px;
  }
  #storybook-explorer-searchfield {
    font-family: 'Shantell Sans', 'Comic Sans MS', cursive;
  }
  /* Hide Storybook's built-in "Level up" onboarding checklist. */
  #storybook-checklist-widget {
    display: none !important;
  }
</style>
<script>
  // Storybook hardcodes the "⋅ Storybook" tab-title suffix; keep it on-brand.
  (function () {
    var rebrand = function () {
      if (document.title.indexOf('Storybook') !== -1) {
        document.title = document.title.replace(/Storybook/g, 'e4 Explorebook');
      }
    };
    window.addEventListener('DOMContentLoaded', function () {
      rebrand();
      var titleEl = document.querySelector('title');
      if (titleEl) {
        new MutationObserver(rebrand).observe(titleEl, { childList: true });
      }
    });
  })();
</script>
