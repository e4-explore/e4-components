<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<style>
  /* Stable Storybook DOM hooks (confirmed against the live manager). */
  #root button:hover:not([disabled]) {
    border-radius: 8px;
  }
  #storybook-explorer-searchfield {
    font-family: 'Shantell Sans', 'Comic Sans MS', cursive;
  }
  /* Hide Storybook's built-in "Level up" onboarding checklist. */
  #storybook-checklist-widget {
    display: none !important;
  }
</style>
<script>
  // Storybook hardcodes the "⋅ Storybook" tab-title suffix; keep it on-brand.
  (function () {
    var rebrand = function () {
      if (document.title.indexOf('Storybook') !== -1) {
        document.title = document.title.replace(/Storybook/g, 'e4 Explorebook');
      }
    };
    window.addEventListener('DOMContentLoaded', function () {
      rebrand();
      var titleEl = document.querySelector('title');
      if (titleEl) {
        new MutationObserver(rebrand).observe(titleEl, { childList: true });
      }
    });
  })();

  // Stale-deploy recovery (mirrors preview-head.html). The manager also
  // lazy-loads content-hashed chunks, so a tab from an earlier deploy can 404
  // on a chunk whose hash changed. Reload once to pull the fresh manifest,
  // guarded by a short time window to avoid a reload loop.
  (function () {
    var KEY = 'e4:chunk-reload-at';
    function recover() {
      var last = 0;
      try { last = parseInt(sessionStorage.getItem(KEY) || '0', 10); } catch (e) {}
      if (Date.now() - last < 10000) return;
      try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      window.location.reload();
    }
    window.addEventListener('vite:preloadError', function (event) {
      if (event && event.preventDefault) event.preventDefault();
      recover();
    });
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      var msg = reason && (reason.message || reason);
      if (typeof msg === 'string' && /dynamically imported module|module script failed/i.test(msg)) {
        recover();
      }
    });
  })();
</script>
