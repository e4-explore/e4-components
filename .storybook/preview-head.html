<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<style>
  body {
    background: #faf9f4;
  }
</style>
<script>
  // Stale-deploy recovery. Story chunks are content-hashed and lazy-loaded, so
  // a tab left open from an earlier deploy 404s when it fetches a story chunk
  // whose hash changed on redeploy — surfacing as "Failed to fetch dynamically
  // imported module". Reload once to pull the fresh manifest; a short time
  // guard prevents a reload loop if the chunk is genuinely missing.
  (function () {
    var KEY = 'e4:chunk-reload-at';
    function recover() {
      var last = 0;
      try { last = parseInt(sessionStorage.getItem(KEY) || '0', 10); } catch (e) {}
      if (Date.now() - last < 10000) return; // already tried just now
      try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      window.location.reload();
    }
    // Vite's preload helper fires this whenever a dynamic import fails to load.
    window.addEventListener('vite:preloadError', function (event) {
      if (event && event.preventDefault) event.preventDefault();
      recover();
    });
    // Fallback for import() rejections that bypass the preload helper.
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      var msg = reason && (reason.message || reason);
      if (typeof msg === 'string' && /dynamically imported module|module script failed/i.test(msg)) {
        recover();
      }
    });
  })();
</script>
