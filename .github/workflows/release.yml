name: Release

# Continuous auto-release: every merge to main bumps the patch version, pushes a
# `vX.Y.Z` git tag, and publishes a GitHub Release. Consumers that reference this
# repo with a `#semver:` range (optionally via Renovate) pick the tags up from
# there — no manual tagging needed here.
#
# The bump commit is pushed with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN
# do NOT retrigger workflows, so this can't loop. The `[skip ci]` marker and the
# `if:` guard below are belt-and-suspenders.

on:
  push:
    branches: [main]

# Serialize releases so two quick merges don't race on the version bump.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Never react to our own release commit.
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version + create tag
        id: bump
        run: |
          # `npm version patch` edits package.json, makes a commit, and creates a
          # matching `vX.Y.Z` tag. It prints the new version (e.g. "v0.1.1").
          new=$(npm version patch -m "chore(release): %s [skip ci]")
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Push commit + tag
        run: git push --follow-tags origin HEAD:main

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.bump.outputs.version }}" --generate-notes
